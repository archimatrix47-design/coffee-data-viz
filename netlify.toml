[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Closes the study harness, the reference viewer and the local-save endpoint. This is the
  # flag rather than NODE_ENV on purpose: NODE_ENV=production during the build makes npm skip
  # devDependencies, which is a trap waiting for whoever adds a build step that needs one
  # (the vendor-bundle rebuild in the README uses esbuild, which lives there). The server
  # already prefers this flag over NODE_ENV, so the gate is explicit and the install is whole.
  ALLOW_DEV_ROUTES = "0"

[functions]
  node_bundler = "esbuild"
  # The flow table is 12MB and is read from disk at container init. Bundling it into the
  # JavaScript would work but makes the function source unreadable and slower to parse;
  # shipping it as a file next to the function keeps JSON.parse on a real file.
  included_files = ["data/processed/**"]

# A dependency-free canary. If /api 502s but this answers, functions work and the fault is in
# the app; if both 502, the app is not the problem.
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# The API. Everything under /api is one function holding the whole Express app.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Extensionless page URLs, matching `extensions: ['html']` on the local server so a link
# works the same in both places.
[[redirects]]
  from = "/network"
  to = "/network.html"
  status = 200
[[redirects]]
  from = "/breakdown"
  to = "/breakdown.html"
  status = 200
[[redirects]]
  from = "/poster"
  to = "/poster.html"
  status = 200

# Belt and braces. The build already leaves these out of dist/, so they would 404 anyway;
# this makes the intent explicit for anyone reading the config rather than the build script.
[[redirects]]
  from = "/dial-study"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/ref"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The vendor bundles are versioned by content and never change in place.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The pages themselves must not be cached hard, or a deploy leaves people on the old build.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
